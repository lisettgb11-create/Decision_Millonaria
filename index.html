<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decisión Millonaria</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game" id="game">
    <header>
      <h1>Decisión Millonaria</h1>
      <div class="score-board">
        <span>Premio actual: <strong id="current-prize">$0</strong></span>
        <span>Mejor puntaje: <strong id="high-score">$0</strong></span>
      </div>
    </header>

    <main id="question-screen">
      <p class="progress" id="progress"></p>
      <h2 id="question-text"></h2>
      <div class="options" id="options"></div>
    </main>

    <section id="end-screen" class="hidden">
      <h2 id="end-title"></h2>
      <p id="end-message"></p>
      <button id="restart-btn">Jugar de nuevo</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
